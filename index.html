<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLS HQ — Pack Life Store</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* ============================================================
   PLS HQ — design tokens
   Palette: Apple-light neutrals + Pack Life "kinetic orange"
   ============================================================ */
:root{
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-alt:#FBFBFD;
  --border:#E5E5EA;
  --border-soft:#EEEEF1;
  --text:#1D1D1F;
  --text-secondary:#6E6E73;
  --text-tertiary:#AEAEB2;
  --accent:#FF5C35;
  --accent-deep:#E6431D;
  --accent-soft:#FFEDE6;
  --blue:#0071E3;
  --blue-soft:#E8F2FE;
  --green:#2FA84F;
  --green-soft:#E6F6EA;
  --amber:#FF9F0A;
  --amber-soft:#FFF3E0;
  --red:#FF3B30;
  --red-soft:#FFEBEA;
  --ric:#0071E3;
  --anna:#AF52DE;
  --chris:#2FA84F;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 4px 12px rgba(0,0,0,.06), 0 16px 40px rgba(0,0,0,.08);
  --font-display: -apple-system, "SF Pro Display", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-body: -apple-system, "SF Pro Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Menlo", "Cascadia Code", monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--accent-soft);color:var(--accent-deep);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--blue);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#D6D6DA;border-radius:10px;border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:236px;flex:0 0 236px;
  background:var(--surface-alt);
  border-right:1px solid var(--border);
  padding:20px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:14px;font-family:var(--font-display);
  box-shadow:var(--shadow-sm);
}
.brand-text{line-height:1.15;}
.brand-text .t1{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
.brand-text .t2{font-size:11px;color:var(--text-secondary);}

.nav-group{margin-bottom:18px;}
.nav-label{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;padding:0 10px;margin-bottom:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:var(--text);
  cursor:pointer;user-select:none;margin-bottom:2px;
  transition:background .12s ease;
}
.nav-item:hover{background:var(--border-soft);}
.nav-item.active{background:var(--text);color:#fff;}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;}
.nav-item .badge{
  margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:20px;padding:1px 6px;min-width:16px;text-align:center;
}
.nav-item.active .badge{background:rgba(255,255,255,.25);}

.sync-box{
  margin-top:auto;padding:10px 10px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);font-size:11.5px;color:var(--text-secondary);
}
.sync-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px;}
.dot.bad{background:var(--red);}
.dot.mid{background:var(--amber);}

.main{flex:1;min-width:0;}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:14px 28px;background:rgba(245,245,247,.82);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.page-title{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;}
.spacer{flex:1;}
.pill-select{
  appearance:none;background:var(--surface);border:1px solid var(--border);
  padding:7px 30px 7px 12px;border-radius:20px;font-size:13px;font-weight:600;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236E6E73'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.identity-select{border-color:var(--border);}
.btn{
  border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s ease, opacity .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.btn-secondary:hover{background:var(--border-soft);}
.btn-ghost{background:transparent;color:var(--blue);padding:8px 10px;}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:16px;}

.content{padding:22px 28px 60px;max-width:1360px;}
.hidden{display:none !important;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-lg{padding:26px;}
.stat-label{font-size:12px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.stat-value{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;}
.stat-sub{font-size:12px;color:var(--text-tertiary);margin-top:6px;}
.stat-value.pos{color:var(--green);}
.stat-value.neg{color:var(--red);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.chip.up{background:var(--green-soft);color:var(--green);}
.chip.down{background:var(--red-soft);color:var(--red);}

.section-head{display:flex;align-items:center;gap:10px;margin:30px 0 14px;}
.section-head h2{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;}
.section-head .hint{font-size:12.5px;color:var(--text-tertiary);}

/* ---------- Rings (signature element) ---------- */
.rings-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.rings-legend{display:flex;flex-direction:column;gap:10px;min-width:190px;}
.legend-row{display:flex;align-items:center;gap:10px;font-size:13px;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;}
.legend-name{font-weight:600;flex:1;}
.legend-amt{font-family:var(--font-mono);font-weight:600;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;font-weight:700;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;
  background:var(--surface-alt);border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-alt);}
td.num,th.num{text-align:right;font-family:var(--font-mono);}
tr.total-row td{font-weight:700;background:var(--surface-alt);border-top:1px solid var(--border);}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--border-soft);color:var(--text-secondary);}
.tag.needs{background:var(--amber-soft);color:#B4690E;}
.tag.cog{background:var(--blue-soft);color:var(--blue);}
.row-actions{display:flex;gap:6px;}
.icon-btn{border:none;background:transparent;color:var(--text-tertiary);padding:4px;border-radius:6px;}
.icon-btn:hover{background:var(--red-soft);color:var(--red);}

/* ---------- Tabs (months) ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;}
.tab{
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--text-secondary);
  background:var(--surface);border:1px solid var(--border);white-space:nowrap;
}
.tab.active{background:var(--text);color:#fff;border-color:var(--text);}

/* ---------- Forms / modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:100;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:560px;padding:26px;
}
.modal h3{margin:0 0 4px;font-family:var(--font-display);font-size:18px;}
.modal p.sub{margin:0 0 18px;color:var(--text-secondary);font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.field input:not([type="checkbox"]):not([type="radio"]),.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;
  background:var(--surface-alt);color:var(--text);
}
.field input[type="checkbox"],.field input[type="radio"]{width:auto;flex:0 0 auto;accent-color:var(--accent);}
.field input[type="file"]{width:100%;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;background:var(--surface-alt);font-size:12.5px;}
.field label.checkbox-label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

/* ---------- Upload dropzone ---------- */
.dropzone{
  border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:36px 20px;
  text-align:center;background:var(--surface-alt);cursor:pointer;transition:.15s;
}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.dropzone .ic{font-size:26px;margin-bottom:8px;}
.dropzone .t{font-weight:600;font-size:14px;margin-bottom:2px;}
.dropzone .s{font-size:12px;color:var(--text-tertiary);}

.mapper-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.mapper-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.mapper-row select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);}

.empty-state{padding:50px 20px;text-align:center;color:var(--text-tertiary);}
.empty-state .ic{font-size:32px;margin-bottom:10px;}

.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
.doc-thumb{
  width:100%;height:90px;border-radius:8px;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px;overflow:hidden;
}
.doc-thumb img{width:100%;height:100%;object-fit:cover;}
.doc-name{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.banner{
  background:var(--amber-soft);border:1px solid #F5D9A8;color:#8A5A0A;border-radius:var(--radius-md);
  padding:12px 16px;font-size:12.5px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;
}
.banner b{font-weight:700;}
.banner.blue{background:var(--blue-soft);border-color:#BEDCFB;color:#0B4E8C;}

@media (max-width: 860px){
  .sidebar{position:fixed;left:-260px;transition:left .2s;z-index:50;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .content{padding:16px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">PL</div>
      <div class="brand-text">
        <div class="t1">PLS HQ</div>
        <div class="t2">Pack Life Store</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Overview</div>
      <div class="nav-item" data-page="dashboard"><span class="ic">◈</span>Dashboard</div>
      <div class="nav-item" data-page="settlement"><span class="ic">⇄</span>Payments & Settlement</div>
      <div class="nav-item" data-page="distribution"><span class="ic">◔</span>Distribution</div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Journal</div>
      <div class="nav-item" data-page="orders"><span class="ic">▤</span>Orders</div>
      <div class="nav-item" data-page="suppliers"><span class="ic">🏷</span>Supplier Payments</div>
      <div class="nav-item" data-page="transactions"><span class="ic">▥</span>Transactions</div>
      <div class="nav-item" data-page="review"><span class="ic">◑</span>Needs Review<span class="badge hidden" id="reviewBadge">0</span></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Files</div>
      <div class="nav-item" data-page="upload"><span class="ic">⇧</span>Upload Center</div>
      <div class="nav-item" data-page="vault"><span class="ic">▢</span>Document Vault</div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Workspace</div>
      <div class="nav-item" data-page="settings"><span class="ic">⚙</span>Settings</div>
    </div>

    <div class="sync-box" id="syncBox">
      <div class="sync-row"><span class="dot mid" id="syncDot"></span><span id="syncText">Connecting…</span></div>
      <div id="syncSub">JSONBin not configured</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="btn-ghost" id="menuBtn" style="display:none;font-size:18px;">☰</button>
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="spacer"></div>
      <select class="pill-select identity-select" id="identitySelect" title="Who's working right now?">
        <option value="">I am…</option>
      </select>
      <select class="pill-select" id="monthSelect"></select>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PLS HQ — application script
   Single-file app. Data lives in a JSONBin.io bin (shared by the
   whole team). Configure CONFIG below before publishing to
   GitHub Pages. See the accompanying SETUP.md for instructions.
   ============================================================ */

const CONFIG = {
  // 1. Create a free bin at https://jsonbin.io (see SETUP.md)
  // 2. Paste your Bin ID and X-Master-Key below
  JSONBIN_BIN_ID: "6a71c7b6f5f4af5e29e95911",
  JSONBIN_API_KEY: "$2a$10$TckKi6ppJW2MOaBYNYg5xe.MpVd/D0bby8ovrw2uO1X5xhJ5ba94S",
  JSONBIN_BASE: "https://api.jsonbin.io/v3/b/"
};
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DEFAULT_CATEGORIES = ["Advertising","Packaging","Printing","Courier","Domains","Software","Banking","Rent","Salaries/Wages","Misc"];
const PARTNERS = ["Riccardo","Anna","Chris"];
const PARTNER_COLORS = {Riccardo:"var(--ric)", Anna:"var(--anna)", Chris:"var(--chris)"};
const PAYMENT_METHODS = ["EFT","Yoco","Ikhoka","Payflex"];
const PAYFLEX_HOLDER = "Chris"; // Payflex payouts go straight to Chris, not the central account

let DB = null;         // in-memory copy of the whole dataset
let currentUser = "";  // session-only identity (not persisted — see Settings)
let page = "dashboard";
let selectedMonth = MONTHS[new Date().getMonth()];
let syncState = "connecting"; // connecting | ok | offline | unconfigured

const emptyDB = () => ({
  meta:{ categories:[...DEFAULT_CATEGORIES], adReservePct:0.10, partners:[...PARTNERS], updatedAt:null,
         centralCollector:"Riccardo", chrisFrontsSuppliers:true },
  orders:[], transactions:[], documents:[], ticketSales:[], reviewQueue:[], skuMap:[]
});

/* ---------------- persistence layer ---------------- */
const jsonbinConfigured = () =>
  CONFIG.JSONBIN_BIN_ID && !CONFIG.JSONBIN_BIN_ID.startsWith("PASTE_") &&
  CONFIG.JSONBIN_API_KEY && !CONFIG.JSONBIN_API_KEY.startsWith("PASTE_");

async function loadDB(){
  if(!jsonbinConfigured()){
    syncState = "unconfigured";
    DB = emptyDB();
    updateSyncBox();
    return;
  }
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE + CONFIG.JSONBIN_BIN_ID + "/latest", {
      headers:{ "X-Master-Key": CONFIG.JSONBIN_API_KEY }
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json = await res.json();
    DB = json.record && json.record.meta ? json.record : emptyDB();
    // backfill any new fields for older bins
    DB.meta = Object.assign(emptyDB().meta, DB.meta||{});
    ["orders","transactions","documents","ticketSales","reviewQueue","skuMap"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
    syncState = "ok";
  }catch(e){
    console.error(e);
    DB = DB || emptyDB();
    syncState = "offline";
  }
  updateSyncBox();
}

let retryTimer=null;
let pendingSince=null; // timestamp of the oldest change not yet confirmed saved
async function saveDB(showToast, attempt){
  attempt = attempt||0;
  DB.meta.updatedAt = new Date().toISOString();
  if(!pendingSince) pendingSince = Date.now();
  if(!jsonbinConfigured()){
    syncState="unconfigured"; updateSyncBox();
    if(showToast) toast("Not saved — JSONBin isn't configured yet (see Settings)");
    return;
  }
  syncState = attempt>0? "retrying" : "saving";
  updateSyncBox();
  try{
    const res = await fetch(CONFIG.JSONBIN_BASE + CONFIG.JSONBIN_BIN_ID, {
      method:"PUT",
      headers:{ "Content-Type":"application/json", "X-Master-Key": CONFIG.JSONBIN_API_KEY },
      body: JSON.stringify(DB)
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    syncState="ok";
    pendingSince=null;
    clearTimeout(retryTimer);
    if(showToast) toast("Saved to PLS HQ ✓");
  }catch(e){
    console.error(e);
    syncState="offline";
    if(showToast) toast(attempt===0? "Couldn't reach JSONBin — your change is on this screen and will keep trying to sync" : "Still offline — will keep retrying in the background");
    clearTimeout(retryTimer);
    const delay = Math.min(4000*(attempt+1), 20000);
    retryTimer = setTimeout(()=>saveDB(false, attempt+1), delay);
  }
  updateSyncBox();
}

function updateSyncBox(){
  const dot=document.getElementById("syncDot"), text=document.getElementById("syncText"), sub=document.getElementById("syncSub");
  if(syncState==="ok"){ dot.className="dot"; text.textContent="Synced with team"; sub.textContent="Last update "+ (DB.meta.updatedAt? new Date(DB.meta.updatedAt).toLocaleString() : "just now"); }
  else if(syncState==="connecting"){ dot.className="dot mid"; text.textContent="Connecting…"; sub.textContent="Reaching JSONBin"; }
  else if(syncState==="saving"){ dot.className="dot mid"; text.textContent="Saving…"; sub.textContent="Pushing your change to the team"; }
  else if(syncState==="retrying"){ dot.className="dot bad"; text.textContent="Retrying sync…"; sub.textContent="Your change is safe on this screen"; }
  else if(syncState==="offline"){ dot.className="dot bad"; text.textContent="Not synced yet"; sub.textContent="Visible here, still trying to reach the team copy"; }
  else{ dot.className="dot bad"; text.textContent="Not configured"; sub.textContent="Add JSONBin keys in Settings"; }
}

/* ---------------- helpers ---------------- */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const R = n => "R "+ (Number(n)||0).toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => ((Number(n)||0)*100).toFixed(1)+"%";
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 2600);
}
function monthOf(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  return MONTHS[d.getMonth()];
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function supplierGroup(order){
  if(order.supplier && order.supplier.trim()) return order.supplier.trim();
  return /puma/i.test(order.product||"") ? "PUMA" : "Other";
}

/* ---------------- computed figures ---------------- */
function ordersForMonth(m){ return DB.orders.filter(o=>o.month===m); }
function txForMonth(m){ return DB.transactions.filter(t=>monthOf(t.date)===m); }
function ticketsForMonth(m){ return DB.ticketSales.filter(t=>monthOf(t.date)===m); }

function monthFigures(m){
  const ords = ordersForMonth(m);
  const revenue = ords.reduce((s,o)=>s+(Number(o.costToClient)||0),0);
  const cogs = ords.reduce((s,o)=>s+(Number(o.costSupplier)||0),0);
  const grossProfit = revenue - cogs;
  const txs = txForMonth(m).filter(t=>t.type==="Expense");
  const totalExpenses = txs.reduce((s,t)=>s+(Number(t.amount)||0),0);
  const byCategory = {};
  txs.forEach(t=>{ byCategory[t.category||"Uncategorized"] = (byCategory[t.category||"Uncategorized"]||0) + Number(t.amount||0); });
  const netProfit = grossProfit - totalExpenses;
  const adReserve = Math.max(netProfit,0) * DB.meta.adReservePct;
  const distributable = netProfit - adReserve;
  const perPartner = distributable/3;
  const ticketProfit = ticketsForMonth(m).reduce((s,t)=>s+((Number(t.costToClient)||0)-(Number(t.yocoFees)||0)),0);
  const split = {Riccardo:perPartner, Anna:perPartner, Chris:perPartner+ticketProfit};
  const margin = revenue? netProfit/revenue : 0;
  return {revenue,cogs,grossProfit,totalExpenses,byCategory,netProfit,adReserve,distributable,perPartner,ticketProfit,split,margin};
}
function settlementForMonth(m){
  const ords = ordersForMonth(m);
  const payflexIn = ords.filter(o=>o.paymentMethod==="Payflex").reduce((s,o)=>s+(+o.costToClient||0),0);
  const centralIn = ords.filter(o=>o.paymentMethod!=="Payflex").reduce((s,o)=>s+(+o.costToClient||0),0);
  const supplierOwedToChris = DB.meta.chrisFrontsSuppliers ? ords.reduce((s,o)=>s+(+o.costSupplier||0),0) : 0;
  // Positive payflexNet = Chris is sitting on more Payflex cash than he spent on suppliers (a surplus he's holding).
  // Negative payflexNet = Payflex didn't cover what he paid suppliers — the business still owes him the gap.
  const payflexNet = payflexIn - supplierOwedToChris;
  const f = monthFigures(m);
  // What actually needs to move from the central account to Chris this month:
  // his profit share, minus whatever Payflex surplus he's already holding (or plus the shortfall).
  const transferToChris = f.split.Chris - payflexNet;
  return { payflexIn, centralIn, supplierOwedToChris, payflexNet, transferToChris, ...f };
}
function yearFigures(){
  const totals = {revenue:0,cogs:0,grossProfit:0,totalExpenses:0,netProfit:0,adReserve:0,distributable:0,ticketProfit:0,split:{Riccardo:0,Anna:0,Chris:0}};
  MONTHS.forEach(m=>{
    const f=monthFigures(m);
    totals.revenue+=f.revenue; totals.cogs+=f.cogs; totals.grossProfit+=f.grossProfit;
    totals.totalExpenses+=f.totalExpenses; totals.netProfit+=f.netProfit; totals.adReserve+=f.adReserve;
    totals.distributable+=f.distributable; totals.ticketProfit+=f.ticketProfit;
    totals.split.Riccardo+=f.split.Riccardo; totals.split.Anna+=f.split.Anna; totals.split.Chris+=f.split.Chris;
  });
  totals.margin = totals.revenue? totals.netProfit/totals.revenue : 0;
  return totals;
}

function renderRings(split, size=150){
  const total = Math.max(split.Riccardo+split.Anna+split.Chris, 0.0001);
  const parts = [
    {name:"Riccardo", val:Math.max(split.Riccardo,0), color:"var(--ric)"},
    {name:"Anna", val:Math.max(split.Anna,0), color:"var(--anna)"},
    {name:"Chris", val:Math.max(split.Chris,0), color:"var(--chris)"}
  ];
  const max = Math.max(...parts.map(p=>p.val), 1);
  const r0=size*0.46, stroke=size*0.085, gap=stroke*1.35;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  parts.forEach((p,i)=>{
    const r = r0 - i*gap;
    const c = 2*Math.PI*r;
    const frac = Math.min(p.val/max,1);
    const dash = c*frac;
    svg += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border-soft)" stroke-width="${stroke}"/>`;
    svg += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 ${size/2} ${size/2})"
      style="transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1)"/>`;
  });
  svg += `</svg>`;
  return svg;
}

/* ---------- Supplier Payments ---------- */
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null, line = "";
    content.items.forEach(item=>{
      const y = item.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>2){
        text += line.trim() + "\n";
        line = "";
      }
      line += item.str + " ";
      lastY = y;
    });
    if(line.trim()) text += line.trim() + "\n";
    text += "\n";
  }
  return text;
}
function guessSkuCostFromText(text){
  // Best-effort: look for every SKU we already know about (from existing orders)
  // appearing in the extracted text, then grab the nearest price-looking number after it.
  const knownSkus = [...new Set(DB.orders.map(o=>(o.sku||"").trim()).filter(Boolean))];
  const lines = [];
  const foundSkus = new Set();
  knownSkus.forEach(sku=>{
    const idx = text.indexOf(sku);
    if(idx===-1) return;
    const window_ = text.slice(idx, idx+120);
    const m = window_.match(/(?:R\s?)?([0-9][0-9,]*\.\d{2})/g);
    if(m && m.length){
      const cost = parseFloat(m[0].replace(/[^0-9.]/g,""));
      lines.push(`${sku}, ${cost}`);
      foundSkus.add(sku);
    }
  });
  return {lines, matchedCount: foundSkus.size, rawText: text};
}
async function handleSupplierPdf(file){
  toast("Reading PDF…");
  try{
    const text = await extractPdfText(file);
    const {lines, matchedCount} = guessSkuCostFromText(text);
    const box = document.getElementById("skuPaste");
    if(lines.length){
      box.value = lines.join("\n");
      toast(`Found ${matchedCount} SKU${matchedCount===1?'':'s'} we recognise in the PDF — check the numbers, then click Match`);
    } else {
      box.value = text.slice(0,2000);
      toast("Couldn't spot any known SKUs automatically — pasted the raw PDF text below, tidy it into \"SKU, cost\" lines and click Match");
    }
    const attach = document.getElementById("attachInvoiceDoc");
    if(attach) attach.checked = true;
    window._pendingSupplierFile = file;
  }catch(e){
    console.error(e);
    toast("Couldn't read that PDF — try pasting the SKU and cost numbers in manually");
  }
}

function skuIndex(){
  const idx = {};
  DB.orders.forEach(o=>{
    if(!o.sku) return;
    const k = o.sku.trim().toLowerCase();
    (idx[k] = idx[k]||[]).push(o);
  });
  return idx;
}
function findOrdersForSupplierSku(supplierSku){
  const key = (supplierSku||"").trim().toLowerCase();
  if(!key) return {orders:[], via:"none"};
  const idx = skuIndex();
  // 1. exact match on our own SKU
  if(idx[key]) return {orders:idx[key], via:"exact"};
  // 2. explicit alias table (Supplier SKU -> our SKU), for when the codes don't share a prefix at all
  const aliases = DB.skuMap.filter(m=>(m.supplierSku||"").trim().toLowerCase()===key);
  if(aliases.length){
    let matched = [];
    aliases.forEach(a=>{
      const ourKey = (a.ourSku||"").trim().toLowerCase();
      if(idx[ourKey]) matched = matched.concat(idx[ourKey]);
    });
    if(matched.length) return {orders:matched, via:"alias"};
  }
  // 3. prefix fallback — e.g. supplier SKU "12345-01" vs our SKU "12345-01-L" (size/variant suffix)
  if(key.length>=4){
    const matched = DB.orders.filter(o=>o.sku && o.sku.trim().toLowerCase().startsWith(key) && o.sku.trim().toLowerCase()!==key);
    if(matched.length) return {orders:matched, via:"prefix"};
  }
  return {orders:[], via:"none"};
}
function applySupplierCosts(pairs){
  const unmatched = [];
  let prefixCount=0, aliasCount=0;
  const fillQty = (o,p)=>{ if(p.qty && (!o.qty || o.qty===1)) o.qty = p.qty; };
  const fillOrderNo = (o,p)=>{ if(p.supplierOrderNo) o.supplierOrderNo = p.supplierOrderNo; };
  pairs.forEach(p=>{
    if(!(p.sku||"").trim()) return;
    const {orders, via} = findOrdersForSupplierSku(p.sku);
    if(!orders.length){ unmatched.push(p); return; }
    if(via==="exact"){
      const target = orders.find(o=>!o.costSupplier) || orders[0];
      target.costSupplier = p.cost;
      if(p.supplierName) target.supplier = p.supplierName;
      fillQty(target, p);
      fillOrderNo(target, p);
    } else {
      // alias / prefix matches can hit several size/variant rows at once — apply to the ones still unresolved
      const targets = orders.filter(o=>!o.costSupplier);
      const toUpdate = targets.length? targets : orders;
      toUpdate.forEach(o=>{
        o.costSupplier = p.cost;
        if(p.supplierName) o.supplier = p.supplierName;
        fillQty(o, p);
        fillOrderNo(o, p);
      });
      if(via==="prefix") prefixCount += toUpdate.length; else aliasCount += toUpdate.length;
    }
  });
  return {unmatched, prefixCount, aliasCount};
}
function parsePastedPairs(text){
  return text.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts = l.split(",").map(s=>s.trim());
    const sku = parts[0]||"";
    const cost = parts[1]!==undefined? parseFloat(parts[1].replace(/[^0-9.\-]/g,"")) : NaN;
    const qty = parts[2]!==undefined? (parseInt(parts[2].replace(/[^0-9\-]/g,""))||1) : 1;
    return {sku, cost:isNaN(cost)?0:cost, qty};
  }).filter(p=>p.sku);
}
function attachSupplierDocIfRequested(matchedCount, totalCount, cb){
  const attach = document.getElementById("attachInvoiceDoc");
  const f = window._pendingSupplierFile;
  if(!(attach && attach.checked && f)){ cb(); return; }
  const note = `Matched ${matchedCount}/${totalCount} SKUs`;
  if(f.size<45000){
    const reader = new FileReader();
    reader.onload = e=>{
      DB.documents.push({id:uid(), name:`Supplier invoice — ${f.name}`, category:"Supplier Invoice", month:selectedMonth,
        note, dataUrl:e.target.result, fileType:f.type, addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()});
      cb();
    };
    reader.readAsDataURL(f);
  } else {
    DB.documents.push({id:uid(), name:`Supplier invoice — ${f.name}`, category:"Supplier Invoice", month:selectedMonth,
      note: note+" — file too large to store here, keep the original safe", addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()});
    cb();
  }
}
function matchPastedSkus(){
  const text = val("skuPaste");
  const supplierName = val("skuSupplierName").trim();
  const pairs = parsePastedPairs(text).map(p=>{
    const hasQty = p.qty && p.qty>1;
    const cost = hasQty? Math.round(p.cost*p.qty*100)/100 : p.cost;
    const unitPrice = p.cost;
    return {...p, cost, unitPrice, supplierName};
  });
  if(!pairs.length){ toast("Nothing to match — paste SKU and cost first, one per line"); return; }
  const {unmatched, prefixCount, aliasCount} = applySupplierCosts(pairs);
  attachSupplierDocIfRequested(pairs.length-unmatched.length, pairs.length, ()=>{
    saveDB(true); render();
    toast(matchSummaryText(pairs.length, unmatched.length, prefixCount, aliasCount));
  });
}
function matchSummaryText(total, unmatchedCount, prefixCount, aliasCount){
  const matched = total-unmatchedCount;
  let msg = unmatchedCount? `Matched ${matched} of ${total} — ${unmatchedCount} SKU(s) not found in Orders` : `Matched all ${total} SKUs`;
  const extras = [];
  if(prefixCount) extras.push(`${prefixCount} via size/variant prefix`);
  if(aliasCount) extras.push(`${aliasCount} via saved SKU mapping`);
  if(extras.length) msg += ` (${extras.join(", ")})`;
  return msg;
}
let supplierParsedRows=[], supplierMapping={};
function handleSupplierFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".pdf")){ handleSupplierPdf(file); return; }
  const done=(headers,rows)=>startSupplierMapper(headers,rows,file);
  if(name.endsWith(".csv")){
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:res=>done(res.meta.fields,res.data)});
  } else {
    const reader=new FileReader();
    reader.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:""});
      done(Object.keys(json[0]||{}), json);
    };
    reader.readAsArrayBuffer(file);
  }
}
function startSupplierMapper(headers, rows, file){
  supplierParsedRows = rows; supplierMapping = {};
  headers.forEach(h=>{
    const l=h.toLowerCase();
    if(!supplierMapping.sku && /sku|article number/.test(l)) supplierMapping.sku=h;
    if(!supplierMapping.cost && /net price|unit price|cost|price|amount/.test(l)) supplierMapping.cost=h;
    if(!supplierMapping.qty && /qty|quantity/.test(l)) supplierMapping.qty=h;
    if(!supplierMapping.orderNo && /order number|po number|order no/.test(l)) supplierMapping.orderNo=h;
    if(!supplierMapping.supplier && /(supplier|brand|vendor)/.test(l)) supplierMapping.supplier=h;
  });
  window._pendingSupplierFile = file;
  document.getElementById("supplierMapperHost").innerHTML = `
    <div style="margin-top:14px;">
      <div class="stat-label">Match the columns (${rows.length} rows)</div>
      <div class="mapper-grid">
        <div class="mapper-row"><span style="width:120px;flex:0 0 120px;color:var(--text-secondary);">SKU</span>
          <select onchange="supplierMapping.sku=this.value"><option value="">— not in file —</option>${headers.map(h=>`<option value="${esc(h)}" ${supplierMapping.sku===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
        <div class="mapper-row"><span style="width:120px;flex:0 0 120px;color:var(--text-secondary);">Cost</span>
          <select onchange="supplierMapping.cost=this.value"><option value="">— not in file —</option>${headers.map(h=>`<option value="${esc(h)}" ${supplierMapping.cost===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
        <div class="mapper-row"><span style="width:120px;flex:0 0 120px;color:var(--text-secondary);">Quantity (optional)</span>
          <select onchange="supplierMapping.qty=this.value; updateSupplierCostHint();"><option value="">— not in file / always 1 —</option>${headers.map(h=>`<option value="${esc(h)}" ${supplierMapping.qty===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
        <div class="mapper-row"><span style="width:120px;flex:0 0 120px;color:var(--text-secondary);">Supplier order no (optional)</span>
          <select onchange="supplierMapping.orderNo=this.value"><option value="">— not in file —</option>${headers.map(h=>`<option value="${esc(h)}" ${supplierMapping.orderNo===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
        <div class="mapper-row"><span style="width:120px;flex:0 0 120px;color:var(--text-secondary);">Supplier name</span>
          <select onchange="supplierMapping.supplier=this.value"><option value="">— not in file —</option>${headers.map(h=>`<option value="${esc(h)}" ${supplierMapping.supplier===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>
      </div>
      <p class="hint" id="supplierCostHint" style="margin:6px 0 14px;"></p>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('supplierMapperHost').innerHTML=''">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="confirmSupplierImport()">Match ${rows.length} rows</button>
      </div>
    </div>
  `;
  updateSupplierCostHint();
}
function updateSupplierCostHint(){
  const el = document.getElementById("supplierCostHint");
  if(!el) return;
  el.innerHTML = supplierMapping.qty
    ? "A Quantity column is mapped, so Cost will be treated as <b>per unit</b> and multiplied by Quantity automatically."
    : "No Quantity column mapped — Cost will be used exactly as-is (as the line total).";
}
function confirmSupplierImport(){
  if(!supplierMapping.sku || !supplierMapping.cost){ toast("Map at least SKU and Cost first"); return; }
  const pairs = supplierParsedRows.map(row=>{
    const unitOrTotal = parseFloat(String(row[supplierMapping.cost]||"0").replace(/[^0-9.\-]/g,""))||0;
    const hasQtyCol = !!supplierMapping.qty;
    const qty = hasQtyCol? (parseInt(String(row[supplierMapping.qty]||"1").replace(/[^0-9\-]/g,""))||1) : 1;
    return {
      sku: row[supplierMapping.sku],
      cost: hasQtyCol? Math.round(unitOrTotal*qty*100)/100 : unitOrTotal,
      unitPrice: unitOrTotal,
      qty,
      supplierOrderNo: supplierMapping.orderNo? String(row[supplierMapping.orderNo]||"").trim() : "",
      supplierName: supplierMapping.supplier? row[supplierMapping.supplier] : val("skuSupplierName").trim()
    };
  }).filter(p=>p.sku);
  const {unmatched, prefixCount, aliasCount} = applySupplierCosts(pairs);
  attachSupplierDocIfRequested(pairs.length-unmatched.length, pairs.length, ()=>{
    document.getElementById("supplierMapperHost").innerHTML="";
    saveDB(true);
    toast(matchSummaryText(pairs.length, unmatched.length, prefixCount, aliasCount));
    render();
  });
}
function toggleSupplierPaid(id){
  const o = DB.orders.find(x=>x.id===id);
  if(!o) return;
  o.supplierPaid = !o.supplierPaid;
  saveDB(true); render();
}

            ${groups[g].orders.map(o=>`

              </tr>`).join("")}

      <p style="font-size:13px;color:var(--text-secondary);margin-top:0;">Upload the invoice from PUMA or another supplier — CSV, XLSX, or <b>PDF</b> — or just paste the numbers straight in below. This fills in the <b>Supplier Cost</b> on any order with a matching SKU automatically. PDFs are read automatically where possible: it looks for SKUs already in your Orders and the nearest price next to them, then lets you check the numbers before anything is applied — always double-check against the actual invoice before matching.</p>
      <div class="field-row">
        <div class="field">
          <label>Paste SKU + cost — one per line ("SKU, cost" or "SKU, cost, qty")</label>
          <textarea id="skuPaste" rows="5" placeholder="310790-05, 682.50&#10;705368-01, 195.00, 2"></textarea>
          <p class="hint" style="margin:6px 0 0;">Add a 3rd number for quantity and PLS HQ treats the cost as <b>per unit</b>, multiplying it in automatically — e.g. "705368-01, 195.00, 2" becomes R390. Leave it off and the cost is used exactly as typed.</p>

function addSkuMapping(){

function trendChart(){
  const revs=[], exps=[], profs=[];

}

let selection = { orders: new Set(), transactions: new Set() };
function clearSelection(){ selection.orders.clear(); selection.transactions.clear(); }
function toggleSelect(collection, id, checked){
  if(checked) selection[collection].add(id); else selection[collection].delete(id);
  render();
}
function toggleSelectAll(collection, ids, checked){
  if(checked) ids.forEach(id=>selection[collection].add(id));
  else ids.forEach(id=>selection[collection].delete(id));
  render();
}
function bulkDelete(collection){
  const ids = selection[collection];
  if(!ids.size) return;
  const label = collection==='orders'? 'order':'transaction';
  if(!confirm(`Delete ${ids.size} selected ${label}${ids.size===1?'':'s'}? This can't be undone.`)) return;
  DB[collection] = DB[collection].filter(r=>!ids.has(r.id));
  ids.clear();
  saveDB(true); render();
}
function bulkBarHTML(collection){
  const n = selection[collection].size;
  if(!n) return "";
  const label = collection==='orders'? 'order':'transaction';
  return `<div class="banner blue" style="display:flex;justify-content:space-between;align-items:center;">
    <span><b>${n}</b> ${label}${n===1?'':'s'} selected</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="selection.${collection}.clear();render();">Clear selection</button>
      <button class="btn btn-danger btn-sm" onclick="bulkDelete('${collection}')">Delete selected</button>
    </div>
  </div>`;
}

function handleWixFiles(files){
  const pdfs = files.filter(f=>f.name.toLowerCase().endsWith(".pdf"));
  const others = files.filter(f=>!f.name.toLowerCase().endsWith(".pdf"));
  if(pdfs.length){ handleWixPdfs(pdfs); }
  else if(others.length){ handleWixFile(others[0]); }
}

function handleWixFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".csv")){
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:res=>startMapper(res.meta.fields, res.data)});
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      const wb = XLSX.read(e.target.result,{type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws,{defval:""});
      startMapper(Object.keys(json[0]||{}), json);
    };
    reader.readAsArrayBuffer(file);
  }
}

/* ---------- Wix order PDFs (per-order receipts) ---------- */
async function handleWixPdfs(files){
  toast(`Reading ${files.length} PDF${files.length===1?"":"s"}…`);
  let rows = [];
  for(const f of files){
    try{
      const text = await extractPdfText(f);
      rows = rows.concat(parseOrderPdfText(text));
    }catch(e){ console.error(e); }
  }
  if(!rows.length){
    toast("Couldn't read order details from those PDFs — add rows manually below");
    rows = [{orderNo:"",date:"",customer:"",sku:"",product:"",qty:1,unitPrice:0,price:0,coupon:"",paymentMethod:"EFT"}];
  } else {
    toast(`Pulled ${rows.length} line${rows.length===1?"":"s"} from ${files.length} PDF${files.length===1?"":"s"} — check before importing`);
  }
  // Normalize dates up front so what's shown in the review table is exactly what will be saved —
  // no silent "defaults to today" happening later at import time.
  rows = rows.map(r=>({...r, date: (r.date && !isNaN(new Date(r.date))) ? r.date : new Date().toISOString()}));
  startPdfOrderReview(rows);
}
function parseOrderPdfText(text){
  // Route to whichever parser matches the actual document — a Wix order receipt
  // ("Order #...", "SKU:") and a Pack Life Store invoice ("Invoice #...", line-item
  // table) look nothing alike, so detect which one this is before parsing.
  if(/Order\s*#/i.test(text)) return parseWixOrderPdfText(text);
  if(/Invoice\s*#/i.test(text)) return parseInvoicePdfText(text);
  return [{orderNo:"", date:"", customer:"", sku:"", product:"", qty:1, unitPrice:0, price:0, coupon:"", paymentMethod:"EFT"}];
}
const MONTH_NAME_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseNamedDate(str){
  // Handles both "31 Jul 2026" and "Aug 5, 2026" orderings.
  let m = str.match(/(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);
  if(m){
    const mi = MONTH_NAME_IDX[m[2].slice(0,3).toLowerCase()];
    if(mi!==undefined) return new Date(Date.UTC(parseInt(m[3]), mi, parseInt(m[1]))).toISOString();
  }
  m = str.match(/([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){
    const mi = MONTH_NAME_IDX[m[1].slice(0,3).toLowerCase()];
    if(mi!==undefined) return new Date(Date.UTC(parseInt(m[3]), mi, parseInt(m[2]))).toISOString();
  }
  return "";
}
function detectPaymentMethod(text){
  const m = text.match(/Paid with\s*[:\-]?\s*([A-Za-z ]+)/i);
  if(!m) return "EFT";
  const p = m[1].toLowerCase();
  if(p.includes("payflex")) return "Payflex";
  if(p.includes("yoco")) return "Yoco";
  if(p.includes("ikhok")) return "Ikhoka";
  return "EFT";
}
/* ---------- Pack Life Store-issued invoices ("Invoice #...", line-item table) ---------- */
function parseInvoicePdfText(text){
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const joined = lines.join("\n");

  const invM = joined.match(/Invoice\s*#\s*(\S+)/i);
  const orderNo = invM? invM[1].replace(/[^A-Za-z0-9\-]/g,"") : "";

  let date = "";
  const issueM = joined.match(/Issue Date:\s*(.+)/i);
  if(issueM) date = parseNamedDate(issueM[1]);

  let customer = "";
  const billIdx = lines.findIndex(l=>/^Bill to:?$/i.test(l));
  if(billIdx>=0 && lines[billIdx+1]) customer = lines[billIdx+1];

  const rows = [];
  lines.forEach(line=>{
    // "PUMA Deviate Pure NITRO™ Running Shoes   1   ZAR 3,199.00   ZAR 3,199.00"
    const m = line.match(/^(.+?)\s+(\d+)\s+(?:R|ZAR)\s?([0-9][0-9,]*\.\d{2})\s+(?:R|ZAR)\s?([0-9][0-9,]*\.\d{2})$/i);
    if(!m) return;
    const product = m[1].trim();
    if(/^(product or service|item|description)$/i.test(product)) return; // header row, just in case
    rows.push({
      orderNo, date, customer, sku:"", product,
      qty: parseInt(m[2])||1, unitPrice: parseFloat(m[3].replace(/,/g,"")),
      price: parseFloat(m[4].replace(/,/g,"")), coupon:"", paymentMethod:"EFT"
    });
  });
  if(!rows.length) rows.push({orderNo, date, customer, sku:"", product:"", qty:1, unitPrice:0, price:0, coupon:"", paymentMethod:"EFT"});
  return rows;
}
function parseWixOrderPdfText(text){
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const joined = lines.join("\n");

  const orderM = joined.match(/Order\s*#\s*(\S+)/i);
  const orderNo = orderM? orderM[1].replace(/[^A-Za-z0-9\-]/g,"") : "";

  let customer = "";
  const orderLineIdx = lines.findIndex(l=>/^Order\s*#/i.test(l));
  if(orderLineIdx>=0 && lines[orderLineIdx+1]) customer = lines[orderLineIdx+1].split(",")[0].trim();

  let date = "";
  const dateM = joined.match(/Placed on\s+(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/i);
  if(dateM){
    const mi = MONTH_NAME_IDX[dateM[2].slice(0,3).toLowerCase()];
    if(mi!==undefined) date = new Date(Date.UTC(parseInt(dateM[3]), mi, parseInt(dateM[1]))).toISOString();
  }

  const paymentMethod = detectPaymentMethod(joined);

  const couponM = joined.match(/(?:Coupon|Discount code|Promo code)[:\s]+(\S+)/i);
  const coupon = couponM? couponM[1] : "";

  const shippingM = joined.match(/Shipping\s+R\s?([0-9][0-9,]*\.\d{2})/i);
  const shipping = shippingM? parseFloat(shippingM[1].replace(/,/g,"")) : 0;

  const rows = [];
  lines.forEach((line,i)=>{
    const skuM = line.match(/^SKU:\s*(\S+)/i);
    if(!skuM) return;
    const sku = skuM[1];
    // Product name: nearest preceding line(s), skipping Size/Colour and stopping at header/customer lines
    let product = "";
    for(let j=i-1;j>=Math.max(0,i-3);j--){
      const cand = lines[j];
      if(/^(Size|Colou?r):/i.test(cand)) continue;
      if(/^Order\s*#/i.test(cand) || /^Placed on/i.test(cand) || cand.includes("@")) break;
      product = product? `${cand} ${product}` : cand;
    }
    // Price/qty: scan a small window of lines after the SKU line and join them, since the
    // price, "x2", and line total don't always land on exactly one text line in every PDF.
    let unitPrice=0, qty=1, lineTotal=0;
    const windowText = lines.slice(i+1, i+6).join(" ");
    const pm = windowText.match(/R\s?([0-9][0-9,]*\.\d{2})\s*(?:x\s?(\d+))?\s*(?:R\s?([0-9][0-9,]*\.\d{2}))?/i);
    if(pm){
      unitPrice = parseFloat(pm[1].replace(/,/g,""));
      qty = pm[2]? parseInt(pm[2]) : 1;
      lineTotal = pm[3]? parseFloat(pm[3].replace(/,/g,"")) : unitPrice;
    }
    rows.push({
      orderNo, date, customer, sku, product: product.trim(), qty,
      unitPrice, price: lineTotal || unitPrice, coupon, paymentMethod
    });
  });
  if(!rows.length){
    rows.push({orderNo, date, customer, sku:"", product:"", qty:1, unitPrice:0, price:0, coupon, paymentMethod});
  } else if(shipping>0){
    rows.push({orderNo, date, customer, sku:"", product:"Shipping", qty:1, unitPrice:shipping, price:shipping, coupon:"", paymentMethod});
  }
  return rows;
}

const TARGET_FIELDS = [
  {key:"date",label:"Order date"},
  {key:"orderNo",label:"Order number"},
  {key:"customer",label:"Customer name"},
  {key:"sku",label:"SKU"},
  {key:"product",label:"Product"},
  {key:"price",label:"Price / order total"},
  {key:"coupon",label:"Coupon used"},
  {key:"payment",label:"Payment method"}
];
function guessMap(headers){
  const g={};
  headers.forEach(h=>{
    const l=h.toLowerCase();
    if(!g.date && /date/.test(l)) g.date=h;
    if(!g.orderNo && /order.?(no|number|#|id)/.test(l)) g.orderNo=h;
    if(!g.customer && /(customer|buyer|name|billing)/.test(l)) g.customer=h;
    if(!g.sku && /sku/.test(l)) g.sku=h;
    if(!g.product && /(product|item|title)/.test(l)) g.product=h;
    if(!g.price && /(price|total|amount|paid)/.test(l)) g.price=h;
    if(!g.coupon && /(coupon|discount|promo)/.test(l)) g.coupon=h;
    if(!g.payment && /(payment|method|gateway|processor)/.test(l)) g.payment=h;
  });
  return g;
}
function normalizePaymentMethod(raw){
  const l=String(raw||"").toLowerCase();
  if(l.includes("payflex")) return "Payflex";
  if(l.includes("yoco")) return "Yoco";
  if(l.includes("ikhoka")||l.includes("ikhokha")) return "Ikhoka";
  if(l.includes("eft")||l.includes("bank")) return "EFT";
  return DB.meta.centralCollector? "EFT" : "EFT";
}
function startMapper(headers, rows){
  parsedRows = rows; mapping = guessMap(headers);
  document.getElementById("wixMapperHost").innerHTML = `
    <div style="margin-top:16px;">

            <select data-target="${f.key}" onchange="mapping['${f.key}']=this.value">
              <option value="">— not in file —</option>
              ${headers.map(h=>`<option value="${esc(h)}" ${mapping[f.key]===h?"selected":""}>${esc(h)}</option>`).join("")}
            </select>
          </div>`).join("")}
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('wixMapperHost').innerHTML=''">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="confirmWixImport()">Import ${rows.length} rows into ${selectedMonth}</button>
      </div>
    </div>
  `;
}

}

/* ---------- Document Vault ---------- */

        <div class="field-row">

        <div class="field-row">
          <div class="field"><label>Bin ID</label><input type="text" value="${jsonbinConfigured()?CONFIG.JSONBIN_BIN_ID:'not set'}" disabled></div>

        <div class="stat-label" style="margin-bottom:12px;">Your identity</div>

function saveReservePct(){
  const v = parseFloat(document.getElementById("reservePct").value);
  if(isNaN(v)) return;
  DB.meta.adReservePct = v/100;
  saveDB(true); render();
}
function saveSettlementSettings(){
  DB.meta.centralCollector = document.getElementById("centralCollector").value;
  DB.meta.chrisFrontsSuppliers = document.getElementById("chrisFronts").value==="true";
  saveDB(true); render();
}
function addCategory(){
  const v = document.getElementById("newCat").value.trim();
  if(!v) return;
  if(!DB.meta.categories.includes(v)) DB.meta.categories.push(v);
  saveDB(true); render();
}
function removeCategory(c){
  DB.meta.categories = DB.meta.categories.filter(x=>x!==c);
  saveDB(true); render();
}
function reloadFromServer(){
  const warning = pendingSince
    ? "You have a change here that hasn't synced yet — reloading from the server will DISCARD it. Try \"Retry saving now\" first. Reload anyway?"
    : "This pulls the latest saved version from JSONBin and replaces what's on this screen. Continue?";
  if(!confirm(warning)) return;
  loadDB().then(()=>{render();toast("Reloaded from server");});
}
function downloadBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `plshq-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importBackup(file){
  if(!file) return;
  if(!confirm("This will replace everything currently in PLS HQ with the contents of this file — including for the whole team, once it syncs. Continue?")) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const incoming = JSON.parse(e.target.result);
      if(!incoming.meta || !incoming.orders) throw new Error("Not a PLS HQ backup file");
      DB = incoming;
      DB.meta = Object.assign(emptyDB().meta, DB.meta||{});
      ["orders","transactions","documents","ticketSales","reviewQueue","skuMap"].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
      saveDB(true);
      toast(`Imported ${DB.orders.length} orders, ${DB.transactions.length} transactions`);
      render();
    }catch(err){
      toast("Couldn't read that file — is it a PLS HQ backup .json?");
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   FORMS (modals)
   ============================================================ */
function closeModal(){ const o=document.querySelector(".overlay"); if(o) o.remove(); }
function openModal(html){
  closeModal();
  const wrap=document.createElement("div");
  wrap.className="overlay";
  wrap.onclick=(e)=>{ if(e.target===wrap) closeModal(); };
  wrap.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(wrap);
}

function openOrderForm(editId){
  const o = editId? DB.orders.find(x=>x.id===editId) : null;
  openModal(`
    <h3>${o? "Edit order":"Add order"}</h3><p class="sub">${o? "Update the details for this order — the month tab it appears under follows the date." : `Manually log a single order line for ${selectedMonth}.`}</p>
    <div class="field-row">
      <div class="field"><label>Wix order no.</label><input id="f_orderNo" value="${esc(o?.orderNo||'')}"></div>
      <div class="field"><label>Date</label><input id="f_date" type="date" value="${o?.date && !isNaN(new Date(o.date)) ? new Date(o.date).toISOString().slice(0,10) : new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Supplier order no. <span style="font-weight:400;color:var(--text-tertiary);">(PUMA's own order/PO number)</span></label><input id="f_supplierOrderNo" value="${esc(o?.supplierOrderNo||'')}"></div>
      <div class="field"><label>Supplier / brand</label><input id="f_supplier" value="${esc(o?.supplier||'')}"></div>
    </div>
    <div class="field"><label>Customer</label><input id="f_customer" value="${esc(o?.customer||'')}"></div>
    <div class="field"><label>Product</label><input id="f_product" value="${esc(o?.product||'')}"></div>
    <div class="field-row">
      <div class="field"><label>SKU</label><input id="f_sku" value="${esc(o?.sku||'')}"></div>
      <div class="field"><label>Coupon used</label><input id="f_coupon" value="${esc(o?.coupon||'')}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Qty</label><input id="f_qty" type="number" min="1" step="1" value="${o?.qty||1}" oninput="autoCalcOrderTotal()"></div>
      <div class="field"><label>Unit price (R)</label><input id="f_unitPrice" type="number" step="0.01" value="${o?.unitPrice??''}" oninput="autoCalcOrderTotal()"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Cost to client (R) — full line total</label><input id="f_costC" type="number" step="0.01" value="${o?.costToClient??''}"></div>
      <div class="field"><label>Cost from supplier (R)</label><input id="f_costS" type="number" step="0.01" value="${o?.costSupplier??''}"></div>
    </div>
    <div class="field"><label>Paid via</label><select id="f_payment">${PAYMENT_METHODS.map(p=>`<option ${o?.paymentMethod===p?"selected":""}>${p}</option>`).join("")}</select></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitOrderForm(${o? `'${o.id}'` : 'null'})">${o? "Save changes":"Save order"}</button>
    </div>
  `);
}
function autoCalcOrderTotal(){
  const qty = parseInt(val('f_qty'))||1;
  const unit = parseFloat(val('f_unitPrice'));
  if(!isNaN(unit)) document.getElementById('f_costC').value = Math.round(unit*qty*100)/100;
}
function submitOrderForm(editId){
  const date = val('f_date');
  const month = monthOf(date) || selectedMonth;
  const fields = {
    orderNo:val('f_orderNo'), supplierOrderNo:val('f_supplierOrderNo'), date, customer:val('f_customer'), supplier:val('f_supplier'),
    product:val('f_product'), sku:val('f_sku'), coupon:val('f_coupon'), paymentMethod:val('f_payment')||"EFT",
    qty:parseInt(val('f_qty'))||1, unitPrice:parseFloat(val('f_unitPrice'))||0,
    costToClient:parseFloat(val('f_costC'))||0, costSupplier:parseFloat(val('f_costS'))||0
  };
  if(editId){
    const existing = DB.orders.find(o=>o.id===editId);
    if(existing) Object.assign(existing, fields, {month});
  } else {
    DB.orders.push({ id:uid(), month, ...fields, source:"manual", addedBy:currentUser||"Unknown", addedAt:new Date().toISOString() });
  }
  closeModal(); saveDB(true); render();
}

function openTxForm(){
  openModal(`
    <h3>Add transaction</h3><p class="sub">Log an expense or income line for ${selectedMonth}.</p>
    <div class="field-row">
      <div class="field"><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>

function submitTxForm(){

    DB.transactions.push({id:uid(), ...base, category:cat, addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()});

    <div class="field-row">
      <div class="field"><label>Invoice no.</label><input id="f_inv"></div>

function openBillForm(file){
  const sizeOk = file ? file.size < 45000 : true;
  openModal(`
    <h3>Store a bill / document</h3><p class="sub">${file? esc(file.name) : "Attach a file, or just log it with a Drive link."}</p>
    <div class="field"><label>Name</label><input id="f_name" value="${file?esc(file.name):''}"></div>
    <div class="field-row">
      <div class="field"><label>Category</label><select id="f_category"><option value="">Not sure — send to review</option>${DB.meta.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label>Amount (R, optional)</label><input id="f_amount" type="number" step="0.01"></div>
    </div>
    <div class="field"><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Google Drive link ${file && !sizeOk? "(file's too big to store here — paste the link instead)" : "(optional — link to the file if it's already in Drive, or the upload was too large to embed)"}</label><input id="f_link" placeholder="https://drive.google.com/..."></div>
    <div class="field"><label>Note</label><textarea id="f_note"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitBillForm(${file?'true':'false'})">Save</button>
    </div>
  `);
  window._pendingFile = file;
}
function submitBillForm(hasFile){
  const finish = (dataUrl, fileType) => {
    const cat = val('f_category');
    const doc = {
      id:uid(), name:val('f_name')||"Untitled document", category:cat||"Uncategorized",
      month:selectedMonth, note:val('f_note'), driveLink: document.getElementById('f_link')?document.getElementById('f_link').value:"",
      dataUrl: dataUrl||"", fileType: fileType||"", addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()
    };
    DB.documents.push(doc);
    const amount = parseFloat(val('f_amount'));
    if(amount){
      if(!cat){
        DB.reviewQueue.push({id:uid(), date:val('f_date'), description:val('f_name')||"Uploaded bill", amount, source:"document"});
        toast("Document stored + sent amount to Needs Review");
      }else{
        DB.transactions.push({id:uid(), date:val('f_date'), type:"Expense", category:cat, subcategory:"", description:val('f_name')||"Uploaded bill", amount, addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()});
        toast("Document stored + transaction logged");
      }
    } else {
      toast("Document stored in the vault");
    }
    closeModal(); saveDB(true); render();
  };
  if(hasFile && window._pendingFile && window._pendingFile.size < 45000){
    const reader = new FileReader();
    reader.onload = e => finish(e.target.result, window._pendingFile.type);
    reader.readAsDataURL(window._pendingFile);
  } else {
    finish(null,null);
  }
}

/* ---------- shared bits ---------- */
function val(id){ const el=document.getElementById(id); return el? el.value : ""; }
function deleteRow(collection,id){
  if(!confirm("Remove this entry?")) return;
  DB[collection] = DB[collection].filter(r=>r.id!==id);
  saveDB(true); render();
}
function resolveReview(id){
  const sel = document.getElementById("cat_"+id);
  const cat = sel.value;
  if(!cat){ toast("Choose a category first"); return; }
  const item = DB.reviewQueue.find(r=>r.id===id);
  DB.transactions.push({id:uid(), date:item.date, type:"Expense", category:cat, subcategory:"", description:item.description, amount:item.amount, addedBy:currentUser||"Unknown", addedAt:new Date().toISOString()});
  DB.reviewQueue = DB.reviewQueue.filter(r=>r.id!==id);
  saveDB(true); render();
}
function monthTabsHTML(){
  return `<div class="tabs">${MONTHS.map(m=>`<div class="tab ${m===selectedMonth?'active':''}" onclick="selectedMonth='${m}';document.getElementById('monthSelect').value='${m}';clearSelection();render();">${m}</div>`).join("")}</div>`;
}

/* ============================================================
   ROUTER + INIT
   ============================================================ */
function render(){
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active", n.dataset.page===page));
  refreshReviewBadge();
  ({
    dashboard:renderDashboard, orders:renderOrders, transactions:renderTransactions,
    review:renderReview, distribution:renderDistribution, upload:renderUpload,
    vault:renderVault, settings:renderSettings, settlement:renderSettlement, suppliers:renderSuppliers
  })[page]();
}

async function init(){
  // month selector
  const ms = document.getElementById("monthSelect");
  ms.innerHTML = MONTHS.map(m=>`<option value="${m}" ${m===selectedMonth?"selected":""}>${m}</option>`).join("");
  ms.onchange = ()=>{ selectedMonth=ms.value; clearSelection(); render(); };

  const idSel = document.getElementById("identitySelect");
  idSel.innerHTML += PARTNERS.map(p=>`<option value="${p}">${p}</option>`).join("") + `<option value="Other">Other</option>`;
  idSel.onchange = ()=>{ currentUser = idSel.value; };

  document.querySelectorAll(".nav-item").forEach(n=>{
    n.onclick = ()=>{ page=n.dataset.page; clearSelection(); render(); document.getElementById("sidebar").classList.remove("open"); };
  });
  document.getElementById("menuBtn").onclick = ()=> document.getElementById("sidebar").classList.toggle("open");
  if(window.innerWidth<860) document.getElementById("menuBtn").style.display="inline-flex";

  await loadDB();
  render();
}
init();
</script>
